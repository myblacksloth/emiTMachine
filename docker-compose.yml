services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emitmachine
      POSTGRES_USER: emitmachine
      POSTGRES_PASSWORD: emitmachine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emitmachine -d emitmachine"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  postgres-backup:
    image: postgres:16-alpine
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_DB: emitmachine
      POSTGRES_USER: emitmachine
      POSTGRES_PASSWORD: emitmachine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          export PGPASSWORD="$${POSTGRES_PASSWORD}"
          tmp="/backups/emitmachine-latest.sql.tmp"
          out="/backups/emitmachine-latest.sql"
          pg_dump --host=postgres --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" --format=plain --clean --if-exists --no-owner --no-privileges > "$${tmp}" && mv "$${tmp}" "$${out}"
          sleep 28800
        done

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://emitmachine:emitmachine@postgres:5432/emitmachine
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      LOG_LEVEL: info
      LOG_FORMAT: pretty
      RP_ID: localhost
      RP_NAME: emiTMachine
      RP_ORIGIN: http://localhost:5173
      TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      postgres:
        condition: service_healthy
    ports:
        # use all hosts for testing, but only expose to localhost for security
      - "0.0.0.0:4000:4000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:4000
      VITE_ALLOWED_HOSTS: all
    depends_on:
      - backend
    ports:
      - "0.0.0.0:5173:5173"

volumes:
  postgres_data:
