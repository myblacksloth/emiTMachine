services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emitmachine
      POSTGRES_USER: emitmachine
      POSTGRES_PASSWORD: emitmachine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emitmachine -d emitmachine"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://emitmachine:emitmachine@postgres:5432/emitmachine
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      LOG_LEVEL: info
      LOG_FORMAT: pretty
      RP_ID: localhost
      RP_NAME: emiTMachine
      TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
