# Reverse-proxy deployment placeholder.
#
# Usage:
# 1. Copy this file to docker-compose-reverse.yml.
# 2. Copy caddy/config/Caddyfile.example to caddy/config/Caddyfile.
# 3. Replace the placeholder domain in Caddyfile.
# 4. Export the required environment variables before starting:
#    PUBLIC_DOMAIN=your.domain.com
#    TOTP_ENCRYPTION_KEY=<32-byte-base64-key>
#
# The real docker-compose-reverse.yml and caddy/config/Caddyfile are ignored by Git.

services:
  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs/:/certs:ro
      - ./caddy/data/:/data
      - ./caddy/conf/:/config
    networks:
      - gotproxed
      - emitmachineint
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_PTRACE
      - SYS_TIME
      - SYSLOG
      - NET_ADMIN
      - SYS_RAWIO

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emitmachine
      POSTGRES_USER: emitmachine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emitmachine -d emitmachine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emitmachineint

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://emitmachine:${POSTGRES_PASSWORD:-change-me}@postgres:5432/emitmachine
      CORS_ORIGIN: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      COOKIE_SECURE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RP_ID: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      RP_NAME: emiTMachine
      RP_ORIGIN: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emitmachineint

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    networks:
      - emitmachineint

volumes:
  postgres_data:

networks:
  emitmachineint:
    internal: true
  gotproxed:
    driver: bridge
