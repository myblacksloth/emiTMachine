# Reverse-proxy deployment placeholder.
#
# Usage:
# 1. Copy this file to docker-compose-reverse.yml.
# 2. Copy caddy/config/Caddyfile.example to caddy/config/Caddyfile.
# 3. Replace the placeholder domain in Caddyfile.
# 4. Copy the reverse env examples to private env files.
# 5. Fill the private env files with your real values.
#
# The real docker-compose-reverse.yml, docker-compose-reverse.*.env and
# caddy/config/Caddyfile are ignored by Git.

services:
  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs/:/certs:ro
      - ./caddy/data/:/data
      - ./caddy/conf/:/config
    networks:
      - gotproxed
      - emitmachineint
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_PTRACE
      - SYS_TIME
      - SYSLOG
      - NET_ADMIN
      - SYS_RAWIO

  postgres:
    image: postgres:16-alpine
    user: postgres
    env_file:
      - ./docker-compose-reverse.postgres.env
    environment:
      POSTGRES_DB: emitmachine
      POSTGRES_USER: emitmachine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emitmachine -d emitmachine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emitmachineint
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: ./backend
    user: node
    env_file:
      - ./docker-compose-reverse.backend.env
    environment:
      PORT: 4000
      RP_NAME: emiTMachine
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emitmachineint
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
    user: node
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    networks:
      - emitmachineint
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:

networks:
  emitmachineint:
    internal: true
  gotproxed:
    driver: bridge
